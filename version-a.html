<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Version A — Calendar Permission</title><style>
:root{--bg:#f6f7f9;--card:#fff;--text:#20242c;--muted:#697386;--border:#e1e5eb;--accent:#315efb;--accent-hover:#2449d8;--ok:#087443}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}
main{width:100%;max-width:440px}.brand{display:flex;align-items:center;gap:10px;margin:0 0 30px;color:#3c4658;font-size:14px;font-weight:650}.brand-mark{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:#20242c;color:white;font-size:17px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:28px;box-shadow:0 12px 35px rgba(20,30,50,.06)}.eyebrow{font-size:11px;letter-spacing:.12em;font-weight:750;color:var(--muted);text-transform:uppercase;margin:0 0 22px}
.icon{width:48px;height:48px;border-radius:13px;background:#f0f2f5;display:grid;place-items:center;font-size:23px;margin-bottom:22px}h1{font-size:25px;letter-spacing:-.035em;line-height:1.2;margin:0 0 12px}p{line-height:1.6}.description{font-size:15px;color:var(--muted);margin:0 0 24px}
.permission{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:22px}.permission-icon{width:38px;height:38px;border-radius:10px;background:#f3f5f8;display:grid;place-items:center;font-size:18px}.permission strong{display:block;font-size:14px;margin-bottom:3px}.permission span{font-size:12px;color:var(--muted)}
button{width:100%;min-height:45px;border-radius:10px;padding:12px 15px;font:inherit;font-size:14px;font-weight:650;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--text)}button.primary{background:var(--accent);color:white;border-color:var(--accent);margin-bottom:9px}button.primary:hover{background:var(--accent-hover)}button:hover{filter:brightness(.98)}
.note{text-align:center;color:var(--muted);font-size:12px;margin:17px 0 0}.status{min-height:20px;font-size:13px;text-align:center;color:var(--ok);margin:13px 0 0}@media(max-width:480px){body{padding:16px}.card{padding:23px}}
</style></head><body><main>
<div class="brand"><div class="brand-mark">✦</div> Personal AI</div><section class="card">
<p class="eyebrow">Version A · Traditional request</p><div class="icon" aria-hidden="true">▦</div>
<h1>Allow access to your calendar?</h1><p class="description">Give Personal AI permission to access your calendar.</p>
<div class="permission"><div class="permission-icon">▦</div><div><strong>Calendar</strong><span>Permission requested</span></div></div>
<button class="primary" id="allow">Allow access</button><button id="deny">Not now</button><p class="status" id="status" aria-live="polite"></p></section>
<p class="note">Prototype only · No calendar data is accessed.</p></main><script>
const status=document.getElementById('status');
document.getElementById('allow').onclick=()=>status.textContent='Choice recorded for this demo.';
document.getElementById('deny').onclick=()=>status.textContent='No access granted in this demo.';
</script></body></html>
